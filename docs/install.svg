<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Install in three steps: run install.sh, turn on Developer mode, Load unpacked the extension folder">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: #f6f8fa; } .card { fill: #fff; stroke: #d0d7de; } .fg { fill: #1f2328; } .muted { fill: #59636e; }
    .bar { fill: #eaeef2; } .field { fill: #f6f8fa; stroke: #d0d7de; } .arrow { stroke: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; } .card { fill: #161b22; stroke: #30363d; } .fg { fill: #e6edf3; } .muted { fill: #9198a1; }
      .bar { fill: #21262d; } .field { fill: #0d1117; stroke: #30363d; } .arrow { stroke: #6e7681; }
    }
  </style>
  <rect class="bg" width="880" height="250" rx="16"/>

  <!-- step 1: terminal -->
  <g transform="translate(24 24)">
    <rect class="card" width="256" height="202" rx="12"/>
    <circle cx="26" cy="28" r="14" fill="#2563eb"/><text x="26" y="33" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="48" y="33" font-size="15" font-weight="600" class="fg">Run the installer</text>
    <rect x="16" y="56" width="224" height="98" rx="8" fill="#0d1117"/>
    <circle cx="30" cy="68" r="4" fill="#ff5f57"/><circle cx="42" cy="68" r="4" fill="#febc2e"/><circle cx="54" cy="68" r="4" fill="#28c840"/>
    <text x="28" y="96" font-size="12" class="mono" fill="#7ee787">$ <tspan fill="#e6edf3">./install.sh</tspan></text>
    <text x="28" y="116" font-size="11" class="mono" fill="#79c0ff">==&gt; <tspan fill="#c9d1d9">Installing yt-dlp</tspan></text>
    <text x="28" y="134" font-size="11" class="mono" fill="#79c0ff">==&gt; <tspan fill="#c9d1d9">Connected to Chrome</tspan></text>
    <text x="16" y="180" font-size="12" class="muted">Sets up yt-dlp, ffmpeg and the</text>
    <text x="16" y="196" font-size="12" class="muted">helper Chrome talks to.</text>
  </g>

  <path class="arrow" d="M288 125 h16 m-6 -6 l6 6 l-6 6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 2: developer mode -->
  <g transform="translate(312 24)">
    <rect class="card" width="256" height="202" rx="12"/>
    <circle cx="26" cy="28" r="14" fill="#2563eb"/><text x="26" y="33" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="48" y="33" font-size="15" font-weight="600" class="fg">Turn on Developer mode</text>
    <rect class="field" x="16" y="56" width="224" height="98" rx="8"/>
    <rect class="bar" x="17" y="57" width="222" height="26" rx="7"/>
    <text x="28" y="74" font-size="11" class="mono muted">chrome://extensions</text>
    <text x="28" y="120" font-size="13" class="fg">Developer mode</text>
    <rect x="178" y="106" width="40" height="22" rx="11" fill="#2563eb"/><circle cx="207" cy="117" r="8" fill="#fff"/>
    <text x="16" y="180" font-size="12" class="muted">Switch in the top-right corner</text>
    <text x="16" y="196" font-size="12" class="muted">of the Extensions page.</text>
  </g>

  <path class="arrow" d="M576 125 h16 m-6 -6 l6 6 l-6 6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 3: load unpacked -->
  <g transform="translate(600 24)">
    <rect class="card" width="256" height="202" rx="12"/>
    <circle cx="26" cy="28" r="14" fill="#2563eb"/><text x="26" y="33" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="48" y="33" font-size="15" font-weight="600" class="fg">Load the extension</text>
    <rect class="field" x="16" y="56" width="224" height="98" rx="8"/>
    <rect x="32" y="70" width="112" height="28" rx="14" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="88" y="89" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">Load unpacked</text>
    <path d="M36 120 h14 l4 4 h22 v18 h-40 z" fill="#54aeff"/>
    <text x="86" y="137" font-size="13" class="mono fg">extension/</text>
    <text x="16" y="180" font-size="12" class="muted">Pick the extension folder,</text>
    <text x="16" y="196" font-size="12" class="muted">then refresh YouTube.</text>
  </g>
</svg>
